<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parley — Replay</title>
<link rel="stylesheet" href="./chrome.css">
</head>
<body class="replay-viewer">
<div id="layout">
  <div id="stage">
    <div id="topband">
      <div id="wordmark">PAR<span>LEY</span></div>
      <div id="clock">ROUND 1</div>
      <div id="topright">
        <span id="statuschip">replay</span>
        <button id="feedtoggle">CHAT »</button>
      </div>
    </div>
    <div id="scorebug" role="region" aria-label="Current match points"></div>
    <div id="board-wrap">
      <canvas id="table" width="960" height="640"></canvas>
      <div id="lightpool"></div>
      <div id="grain"></div>
      <div id="endscreen"></div>
    </div>
    <div id="transport">
      <div class="scrub" id="scrub"></div>
      <div class="tbar">
        <button class="tbtn" id="play">❚❚</button>
        <span class="tpos" id="pos">0 / 0</span>
      </div>
    </div>
    </div>
  <aside id="replay-sidebar" aria-label="Table chat">
    <div class="chat-header">
      <div><h1>Table chat</h1><p>Conversation and points · follows playback</p></div>
      <button id="chat-follow" class="tbtn" type="button">Following</button>
    </div>
    <div id="feed" role="region" aria-label="Replay conversation" tabindex="0"></div>
  </aside>
</div>
<div id="loading">LOADING REPLAY…</div>
<script src="./renderer.js"></script>
<script src="./parley_replay.js"></script>
<script src="./static_replay.js"></script>
<script>
  var canvas = document.getElementById("table");
  function fit() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  fit();
  ParleyRenderer.bindFeedToggle(document.getElementById("feedtoggle"));
  // attach happens in static_replay.js once the wasm module loads
</script>
</body>
</html>
